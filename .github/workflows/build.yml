name: Build

on:
  push:
    tags:
      - '*'
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }} (Lua ${{ matrix.lua }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # VLC 3.x для Windows и macOS: встроенный Lua 5.1 с патчем VLC
          # (размеры в байткоде 32-битные, scripts/patches/vlc3-luac-32bits.patch)
          - { target: windows, lua: 5.1.5, os: windows-latest }
          - { target: macos,   lua: 5.1.5, os: macos-latest }
          # VLC 3.x из Debian/Ubuntu слинкован с системным liblua5.2
          - { target: linux,   lua: 5.2.4, os: ubuntu-latest }
          # VLC 4.x использует Lua 5.4 на всех платформах
          - { target: vlc4,    lua: 5.4.7, os: ubuntu-latest }

    steps:
      - uses: actions/checkout@v7

      - name: Cache luac
        uses: actions/cache@v6
        with:
          path: build
          key: luac-v2-${{ runner.os }}-${{ matrix.lua }}-${{ hashFiles('scripts/**') }}

      - name: Build (Windows, MSVC)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build.ps1 -Target ${{ matrix.target }}

      - name: Build (Linux / macOS)
        if: runner.os != 'Windows'
        run: scripts/build.sh ${{ matrix.lua }} ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: vkplay-${{ matrix.target }}
          path: dist/vkplay-${{ matrix.target }}.luac
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: vkplay-*
          merge-multiple: true

      - name: Add source script and checksums
        working-directory: dist
        run: |
          cp ../src/vkplay.lua .
          sha256sum --binary vkplay-*.luac vkplay.lua > SHA256SUMS
          cat SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
